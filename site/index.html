<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP-Rechtsradar</title>
  <meta name="description" content="Monatlich aktualisierte, KI-erstellte Übersicht der Gesetze und Regeln für CRM, E-Commerce, Buchhaltung, HR und ERP in Deutschland – filterbar für Unternehmer, maschinenlesbar für KI.">
  <link rel="alternate" type="application/json" href="rules.json" title="Regeln als JSON">
  <link rel="alternate" type="text/markdown" href="rules.md" title="Regeln als Markdown">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="./" class="brand">ERP-Rechtsradar</a>
      <div class="topbar-actions">
        <a href="#" id="report-link" class="btn btn-primary" data-contact data-i18n="reportNav"></a>
        <button type="button" id="lang-toggle" class="btn btn-ghost" aria-label="Sprache wechseln / switch language">EN</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Filter">
      <div class="sidebar-head">
        <h2 class="sidebar-title" data-i18n="filters"></h2>
        <button type="button" id="reset" class="link-btn" data-i18n="reset"></button>
      </div>

      <input type="search" id="search" class="search" autocomplete="off">

      <fieldset class="filter-group">
        <legend data-i18n="status"></legend>
        <div class="chips" id="status-chips"></div>
      </fieldset>

      <fieldset class="filter-group">
        <legend data-i18n="categories"></legend>
        <div class="chips" id="cat-chips"></div>
      </fieldset>

      <fieldset class="filter-group">
        <legend data-i18n="jurisdiction"></legend>
        <div class="chips" id="jur-chips"></div>
      </fieldset>

      <details class="profile" id="profile">
        <summary><span data-i18n="profileTitle"></span><span class="profile-hint" data-i18n="profileHint"></span></summary>
        <div class="profile-body">
          <div class="profile-numbers" id="profile-numbers"></div>
          <fieldset class="filter-group">
            <legend data-i18n="businessModel"></legend>
            <div class="checks" id="profile-models"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend data-i18n="activities"></legend>
            <div class="checks checks-list" id="profile-activities"></div>
          </fieldset>
          <label class="toggle"><input type="checkbox" id="only-relevant"> <span data-i18n="onlyRelevant"></span></label>
          <p class="fine" data-i18n="profileNote"></p>
        </div>
      </details>

      <button type="button" class="btn btn-primary sidebar-close" id="filter-close"></button>
    </aside>

    <main class="content">
      <section class="intro">
        <p class="tagline" data-i18n="tagline"></p>
        <p class="disclaimer" role="note"><strong data-i18n="disclaimerTitle"></strong> <span id="disclaimer-text"></span></p>
      </section>

      <div class="toolbar">
        <button type="button" class="btn btn-ghost filter-toggle" id="filter-toggle" aria-controls="sidebar" aria-expanded="false"></button>
        <p class="result-count" id="count" aria-live="polite"></p>
      </div>

      <ol class="rules" id="rules"></ol>
    </main>
  </div>

  <footer class="bottombar">
    <div class="bottombar-inner">
      <span id="footer-meta" class="footer-meta"></span>
      <nav class="footer-links">
        <a href="rules.json">JSON</a>
        <a href="rules.md">Markdown</a>
        <a href="llms.txt">llms.txt</a>
        <span class="sep" aria-hidden="true"></span>
        <a href="impressum.html" data-i18n="imprint"></a>
        <a href="datenschutz.html" data-i18n="privacy"></a>
      </nav>
    </div>
  </footer>
</body>
</html>
