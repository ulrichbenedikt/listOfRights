name: Validate & daily rebuild

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily rebuild on Vercel so computed statuses in rules.json/rules.md flip on their dates
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data
        run: node scripts/build.mjs --check
      - name: Check links
        if: github.event_name == 'pull_request'
        run: node scripts/check-links.mjs

  rebuild:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret not set, skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
